ead -6\necho \"=== kazumi.fyi 无 tag 默认榜单里看有没有 MAPPA 作品 ===\"\ncurl -s -m 20 \"https://api.kazumi.fyi/kazumi/v1/popular/subjects?limit=20\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\nd=json.load(sys.stdin); data=d if isinstance(d,list) else d.get('data',[])\nprint('count:',len(data))\n\" 2>&1 | head -3", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 尝试 v0 POST 反代 (bgmapi.anibt.net) 大小写 ===\"\nfor t in \"MAPPA\" \"mappa\"; do\n  enc=$(python -c \"import urllib.parse; print(urllib.parse.quote('$t'))\")\n  echo \"--- tag=$t ---\"\n  curl -s -m 20 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=3\" -H \"Content-Type: application/json\" -d \"{\\\"keyword\\\":\\\"\\\",\\\"sort\\\":\\\"heat\\\",\\\"filter\\\":{\\\"type\\\":[2],\\\"tag\\\":[\\\"$t\\\"]}}\" | head -c 300\n  echo\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 反代 v0 POST 稳定性测试 ===\"\nfor t in \"京都动画\" \"异世界\" \"搞笑\"; do\n  enc=$(python -c \"import urllib.parse; print(urllib.parse.quote('$t'))\")\n  echo \"--- tag=$t ---\"\n  curl -s -m 20 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=3\" -H \"Content-Type: application/json\" -d \"{\\\"keyword\\\":\\\"\\\",\\\"sort\\\":\\\"heat\\\",\\\"filter\\\":{\\\"type\\\":[2],\\\"tag\\\":[\\\"$t\\\"]}}\" | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    print('total:', d.get('total'))\n    for x in d.get('data',[])[:3]: print(' -', x.get('id'), (x.get('name_cn') or x.get('name')))\nexcept Exception as e: print('err',e)\n\" 2>&1 | head -6\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== P1: 孤独摇滚 328609 的角色列表 ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects/328609/characters\" -H \"User-Agent: Mozilla/5.0\" -o c1.json\npython -c \"\nimport json\nd=json.load(open('c1.json',encoding='utf-8'))\nprint('count:', len(d))\nif d: print('keys:', sorted(d[0].keys()))\nprint('sample:', json.dumps(d[0], ensure_ascii=False)[:600])\n\"\necho \"=== P2: 角色详情 id=1 (凉宫春日?) 用列表里的角色id ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/characters/130431\" -H \"User-Agent: Mozilla/5.0\" -o c2.json\npython -c \"\nimport json\nd=json.load(open('c2.json',encoding='utf-8'))\nprint('keys:', sorted(d.keys()))\nprint('sample:', json.dumps(d, ensure_ascii=False)[:600])\n\"", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== P3: 人物详情 person (孤独摇滚 里的声优) ===\"\n# 从 c1.json 取第一个 actors 的 id\npython -c \"\nimport json\nd=json.load(open('c1.json',encoding='utf-8'))\nfor ch in d:\n    if ch.get('actors'):\n        print(ch['id'], ch['actors'][0]['id'], ch['actors'][0].get('name'), ch['actors'][0].get('relation'))\n        break\n\"\necho \"--- 取到 id 后测 persons/{id} ---\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/persons/25841\" -H \"User-Agent: Mozilla/5.0\" -o p1.json\npython -c \"\nimport json\nd=json.load(open('p1.json',encoding='utf-8'))\nprint('keys:', sorted(d.keys()))\nprint('sample:', json.dumps(d, ensure_ascii=False)[:500])\n\" 2>&1 | head -10\necho \"=== P4: 人物出演作品 persons/{id}/subjects ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/persons/25841/subjects\" -H \"User-Agent: Mozilla/5.0\" -o p2.json\npython -c \"\nimport json\nd=json.load(open('p2.json',encoding='utf-8'))\nprint('count:', len(d))\nif d: print('keys:', sorted(d[0].keys()))\nprint('sample:', json.dumps(d[0], ensure_ascii=False)[:500])\n\" 2>&1 | head -10", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== P5: 关联条目 subjects/{id}/subjects (孤独摇滚 328609) ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects/328609/subjects\" -H \"User-Agent: Mozilla/5.0\" -o r1.json\npython -c \"\nimport json\nd=json.load(open('r1.json',encoding='utf-8'))\nprint('count:', len(d))\nif d: print('keys:', sorted(d[0].keys()))\nfor x in d[:8]: print(' -', x.get('relation'), x.get('id'), (x.get('name_cn') or x.get('name')))\n\" 2>&1 | head -15\necho \"=== P6: 角色出演作品 characters/{id}/subjects ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/characters/10956/subjects\" -H \"User-Agent: Mozilla/5.0\" -o c3.json\npython -c \"\nimport json\nd=json.load(open('c3.json',encoding='utf-8'))\nprint('count:', len(d))\nif d: print('keys:', sorted(d[0].keys()))\nfor x in d[:5]: print(' -', x.get('relation'), x.get('id'), (x.get('name_cn') or x.get('name')), x.get('staff'))\n\" 2>&1 | head -10", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 进击的巨人 325632 角色列表，检查图片尺寸/比例 ===\"\n# 进击的巨人 id 需要确认，先用孤独摇滚已有数据 + 找进击的巨人\nfor sid in 325632 331569; do\n  echo \"--- subject $sid ---\"\n  curl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects/$sid\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nprint('name:', d.get('name_cn') or d.get('name'), 'id:', d.get('id'))\n\" 2>&1 | head -2\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 搜索确认进击的巨人 id ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects?type=2&sort=rank&year=2013&month=4&limit=20\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nfor x in d.get('data',[]):\n    n = x.get('name_cn') or x.get('name')\n    if '进击' in n or '巨人' in n: print(x.get('id'), n)\n\" 2>&1 | head -5", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 进击的巨人 55770 角色列表 ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects/55770/characters\" -H \"User-Agent: Mozilla/5.0\" -o atk.json\npython -c \"\nimport json\nd=json.load(open('atk.json',encoding='utf-8'))\nprint('角色总数:', len(d))\n# 列出所有角色名和图片 URL（从 URL 判断尺寸）\nfor ch in d[:20]:\n    img = ch.get('images',{})\n    large = img.get('large') or ''\n    medium = img.get('medium') or ''\n    print(f\\\"{ch['id']} | {ch.get('name_cn') or ch.get('name')} | relation={ch.get('relation')} | medium={medium[-60:]}\\\")\n\" 2>&1 | head -25", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 拉取角色图片，检查实际宽高 ===\"\npython -c \"\nimport json, urllib.request, ssl, io\nctx = ssl._create_unverified_context()\nd = json.load(open('atk.json',encoding='utf-8'))\ndef img_size(url):\n    try:\n        req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})\n        data = urllib.request.urlopen(req, timeout=15, context=ctx).read()\n        # 解析 PNG/JPEG 尺寸（简单：JPEG 从 SOF 段，PNG 从 IHDR）\n        if data[:3] == b'\\xff\\xd8\\xff':\n            # JPEG\n            i = 2\n            while i < len(data):\n                if data[i] != 0xFF: i+=1; continue\n                marker = data[i+1]\n                if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):\n                    h = int.from_bytes(data[i+5:i+7],'big'); w = int.from_bytes(data[i+7:i+9],'big')\n                    return w,h\n                seg_len = int.from_bytes(data[i+2:i+4],'big')\n                i += 2 + seg_len\n            return None\n        elif data[:8] == b'\\x89PNG\\r\\n\\x1a\\n':\n            w = int.from_bytes(data[16:20],'big'); h = int.from_bytes(data[20:24],'big')\n            return w,h\n        return None\n    except Exception as e:\n        return ('err', str(e)[:40])\nfor ch in d[:12]:\n    url = ch.get('images',{}).get('medium') or ch.get('images',{}).get('large')\n    if not url: continue\n    if url.startswith('//'): url = 'https:' + url\n    w,h = img_size(url)\n    ratio = f'{w/h:.2f}' if isinstance(w,int) and h else '-'\n    print(f\\\"{ch.get('name_cn') or ch.get('name')} | relation={ch.get('relation')} | {w}x{h} | 宽高比={ratio}\\\")\n\" 2>&1 | head -15", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\npython -c \"\nimport json, urllib.request, ssl\nctx = ssl._create_unverified_context()\nd = json.load(open('atk.json',encoding='utf-8'))\ndef img_size(url):\n    try:\n        req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})\n        data = urllib.request.urlopen(req, timeout=15, context=ctx).read()\n        if data[:3] == b'\\xff\\xd8\\xff':\n            i = 2\n            while i < len(data):\n                if data[i] != 0xFF: i+=1; continue\n                marker = data[i+1]\n                if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):\n                    return int.from_bytes(data[i+7:i+9],'big'), int.from_bytes(data[i+5:i+7],'big')\n                seg_len = int.from_bytes(data[i+2:i+4],'big')\n                i += 2 + seg_len\n            return None\n        elif data[:8] == b'\\x89PNG\\r\\n\\x1a\\n':\n            return int.from_bytes(data[16:20],'big'), int.from_bytes(data[20:24],'big')\n        return None\n    except Exception as e:\n        return None\n# 检查全部 46 个角色的图片比例分布\nlongs = []; squares = []\nfor ch in d:\n    url = ch.get('images',{}).get('medium') or ch.get('images',{}).get('large')\n    if not url: continue\n    if url.startswith('//'): url = 'https:' + url\n    wh = img_size(url)\n    if wh and wh[0] and wh[1]:\n        ratio = wh[0]/wh[1]\n        name = ch.get('name_cn') or ch.get('name')\n        (longs if ratio < 0.7 else squares).append((name, round(ratio,2), ch.get('relation')))\nprint('长立绘(比例<0.7):', len(longs))\nfor n,r,rel in longs[:8]: print(f'  {n} {r} {rel}')\nprint('近似方形(比例>=0.7):', len(squares))\nfor n,r,rel in squares[:8]: print(f'  {n} {r} {rel}')\n\" 2>&1 | head -25", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 检查同角色不同尺寸图片的比例（small/grid/medium/large） ===\"\npython -c \"\nimport json, urllib.request, ssl\nctx = ssl._create_unverified_context()\nd = json.load(open('atk.json',encoding='utf-8'))\ndef img_size(url):\n    try:\n        req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})\n        data = urllib.request.urlopen(req, timeout=15, context=ctx).read()\n        if data[:3] == b'\\xff\\xd8\\xff':\n            i = 2\n            while i < len(data):\n                if data[i] != 0xFF: i+=1; continue\n                marker = data[i+1]\n                if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):\n                    return int.from_bytes(data[i+7:i+9],'big'), int.from_bytes(data[i+5:i+7],'big')\n                seg_len = int.from_bytes(data[i+2:i+4],'big')\n                i += 2 + seg_len\n            return None\n        elif data[:8] == b'\\x89PNG\\r\\n\\x1a\\n':\n            return int.from_bytes(data[16:20],'big'), int.from_bytes(data[20:24],'big')\n        return None\n    except Exception as e:\n        return None\n# 取艾伦（长立绘）和佩特拉（方形）对比各尺寸\ntargets = {18101: '艾伦(长)', 21331: '佩特拉(方)'}\nfor ch in d:\n    if ch['id'] in targets:\n        imgs = ch.get('images',{})\n        print(f\\\"{targets[ch['id']]} id={ch['id']}\\\")\n        for size_key in ['small','grid','medium','large']:\n            url = imgs.get(size_key)\n            if not url: continue\n            if url.startswith('//'): url = 'https:' + url\n            wh = img_size(url)\n            ratio = f'{wh[0]/wh[1]:.2f}' if wh else 'err'\n            print(f'  {size_key}: {wh[0]}x{wh[1]} 比例={ratio}' if wh else f'  {size_key}: 获取失败')\n\" 2>&1 | head -20", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 进击的巨人 55770 制作人员数量 ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects/55770/persons\" -H \"User-Agent: Mozilla/5.0\" -o atk_p.json\npython -c \"\nimport json\nd=json.load(open('atk_p.json',encoding='utf-8'))\nprint('制作人员总数:', len(d))\n# 统计角色类型分布\nfrom collections import Counter\nroles = Counter(x.get('relation') or x.get('role_name') or '无' for x in d)\nfor r,c in roles.most_common(15): print(f'  {r}: {c}')\n\" 2>&1 | head -20\necho \"=== 孤独摇滚 328609 制作人员数量 ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects/328609/persons\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport json,sys\nd=json.load(sys.stdin)\nprint('制作人员总数:', len(d))\n\" 2>&1 | head -3", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 反代 v0 搜 persons 钉宫理惠 ===\"\ncurl -s -m 20 -X POST \"https://bgmapi.anibt.net/v0/search/persons?limit=3\" -H \"Content-Type: application/json\" -d '{\"keyword\":\"钉宫理惠\"}' | head -c 800\necho; echo \"=== 反代 v0 搜 subjects keyword=钉宫理惠 ===\"\ncurl -s -m 20 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=3\" -H \"Content-Type: application/json\" -d '{\"keyword\":\"钉宫理惠\",\"sort\":\"heat\",\"filter\":{\"type\":[2]}}' | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    print('total:', d.get('total'))\n    for x in d.get('data',[])[:3]: print(' -', x.get('id'), (x.get('name_cn') or x.get('name')))\nexcept Exception as e: print('err', e)\n\"", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 反代 v0 keyword=钉宫理惠 重试 3 次 ===\"\nfor i in 1 2 3; do\n  curl -s -m 20 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=3\" -H \"Content-Type: application/json\" -H \"User-Agent: Mozilla/5.0\" -d '{\"keyword\":\"钉宫理惠\",\"sort\":\"match\",\"filter\":{\"type\":[2]}}' | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    print('第${i}次 total:', d.get('total'))\nexcept Exception as e: print('第${i}次 err', e)\n\"\ndone\necho \"=== 对照组：keyword=异世界（已知应出结果）===\"\ncurl -s -m 20 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=3\" -H \"Content-Type: application/json\" -H \"User-Agent: Mozilla/5.0\" -d '{\"keyword\":\"异世界\",\"sort\":\"match\",\"filter\":{\"type\":[2]}}' | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    print('异世界 total:', d.get('total'))\nexcept Exception as e: print('err', e)\n\"", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 反代连通性 + 多参数测试 ===\"\nfor body in '{\"keyword\":\"钉宫理惠\",\"filter\":{\"type\":[2]}}' '{\"keyword\":\"钉宫理惠\"}' '{\"keyword\":\"柯南\",\"filter\":{\"type\":[2]}}' '{\"keyword\":\"异世界\",\"filter\":{\"type\":[2]}}'; do\n  echo \"--- body: $body ---\"\n  curl -s -m 25 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=3\" -H \"Content-Type: application/json\" -H \"User-Agent: Mozilla/5.0\" -H \"Accept: application/json\" -d \"$body\" | head -c 300\n  echo\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 反代 GET v1 旧搜索：钉宫理惠（标题搜索，验证人物名是否在标题索引）===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/search/subject/%E9%92%89%E5%AE%AB%E7%90%86%E6%83%A0?type=2&max_results=5\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    print('results:', d.get('results'))\n    for x in d.get('list',[])[:5]: print(' -', x.get('id'), (x.get('name_cn') or x.get('name')))\nexcept Exception as e: print('err', e)\n\" 2>&1 | head -8\necho \"=== Kazumi 镜像 fyi 搜 persons? 试试常见路径 ===\"\nfor path in \"v0/search/persons\" \"kazumi/v1/search/persons\" \"v1/search/persons\"; do\n  echo \"--- $path ---\"\n  curl -s -m 15 -X POST \"https://api.kazumi.fyi/$path?limit=3\" -H \"Content-Type: application/json\" -d '{\"keyword\":\"钉宫理惠\"}' | head -c 200\n  echo\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 用 Kazumi 完全一致的参数重测 v0 keyword=钉宫理惠 ===\"\n# Kazumi buildBangumiSearchParams: {keyword, sort:heat, filter:{type:[2], tag:[], rank:[\">=0\",\"<=99999\"], nsfw:false}}\nfor sort in heat match; do\n  echo \"--- sort=$sort ---\"\n  curl -s -m 25 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=20\" -H \"Content-Type: application/json\" -H \"User-Agent: Mozilla/5.0\" -d \"{\\\"keyword\\\":\\\"钉宫理惠\\\",\\\"sort\\\":\\\"$sort\\\",\\\"filter\\\":{\\\"type\\\":[2],\\\"tag\\\":[],\\\"rank\\\":[\\\">=0\\\",\\\"<=99999\\\"],\\\"nsfw\\\":false}}\" | head -c 400\n  echo\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 官方 v0 完全照搬 Kazumi 2.2.5 请求体 ===\"\nfor i in 1 2; do\n  curl -s -m 25 -X POST \"https://bgmapi.anibt.net/v0/search/subjects?limit=20\" -H \"Content-Type: application/json\" -H \"User-Agent: Mozilla/5.0\" -d '{\"keyword\":\"钉宫理惠\",\"sort\":\"heat\",\"filter\":{\"type\":[2],\"tag\":[],\"rank\":[\">=0\",\"<=99999\"],\"nsfw\":false}}' | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    print('第' + '$i' + '次 total:', d.get('total'))\n    for x in d.get('data',[])[:8]: print('  -', x.get('id'), (x.get('name_cn') or x.get('name')))\nexcept Exception as e: print('第' + '$i' + '次 err:', repr(e)[:80])\n\"\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 检查 6 部配音作品的简介是否含'钉宫' ===\"\n# 先查这些作品 id：龙与虎、钢炼、夏娜、零之使魔、绯弹的亚里亚、旋风管家\nfor kw in \"龙与虎\" \"灼眼的夏娜\" \"零之使魔\" \"绯弹的亚里亚\" \"旋风管家\"; do\n  enc=$(python -c \"import urllib.parse; print(urllib.parse.quote('$kw'))\")\n  echo \"--- 搜 $kw ---\"\n  curl -s -m 20 \"https://bgmapi.anibt.net/search/subject/$enc?type=2&max_results=1\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    for x in d.get('list',[])[:1]: print('  id:', x.get('id'), (x.get('name_cn') or x.get('name')))\nexcept Exception as e: print('  err', e)\n\"\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 检查作品简介是否含'钉宫' ===\"\nfor id in 909 490 1880 22562; do\n  echo \"--- subject $id ---\"\n  curl -s -m 20 \"https://bgmapi.anibt.net/v0/subjects/$id\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    name = d.get('name_cn') or d.get('name')\n    summary = d.get('summary') or ''\n    has = '钉宫' in summary or '釘宮' in summary\n    # 简介截断显示\n    idx = max(summary.find('钉宫'), summary.find('釘宮'))\n    ctx = summary[max(0,idx-20):idx+20] if idx>=0 else ''\n    print(f'  {name}: 简介含钉宫={has} | 上下文:...{ctx}...')\nexcept Exception as e: print('  err', repr(e)[:60])\n\"\ndone", "Bash=cd \"C:/what i download/Kazumi-main/lib\" && echo \"=== Dio 拦截器/响应改写 ===\"; find . -name \"*.dart\" | xargs grep -ln \"Interceptor\\|interceptor\\|onResponse\\|Transformer\" 2>/dev/null | head -10; echo \"=== BangumiItem 是否含配音字段 ===\"; grep -n \"class BangumiItem\" -A 5 modules/bangumi/bangumi_item.dart | head -10; echo \"=== 搜索列表 UI 是否有特殊渲染 ===\"; grep -n \"bangumiList\\|BangumiCard\" pages/search/search_page.dart | head -10", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 关键验证：Kazumi 镜像 api.kazumi.fyi/v0/search/subjects 搜钉宫理惠 ===\"\ncurl -s -m 25 -X POST \"https://api.kazumi.fyi/v0/search/subjects?limit=10\" -H \"Content-Type: application/json\" -H \"User-Agent: Kazumi/2.2.5\" -d '{\"keyword\":\"钉宫理惠\",\"sort\":\"heat\",\"filter\":{\"type\":[2],\"tag\":[],\"rank\":[\">=0\",\"<=99999\"],\"nsfw\":false}}' | python -c \"\nimport sys,json\ntry:\n    d=json.load(sys.stdin)\n    print('total:', d.get('total'))\n    for x in d.get('data',[])[:10]: print('  -', x.get('id'), (x.get('name_cn') or x.get('name')))\nexcept Exception as e: print('err:', repr(e)[:100])\n\" 2>&1 | head -15", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\ncurl -s -m 25 -X POST \"https://api.kazumi.fyi/v0/search/subjects?limit=5\" -H \"Content-Type: application/json\" -H \"User-Agent: Kazumi/2.2.5\" -d '{\"keyword\":\"钉宫理惠\",\"sort\":\"heat\",\"filter\":{\"type\":[2],\"tag\":[],\"rank\":[\">=0\",\"<=99999\"],\"nsfw\":false}}' -o kz.json\necho \"bytes: $(wc -c < kz.json)\"; head -c 1500 kz.json", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 反代 GET persons/3936 (钉宫理惠) 详情，看是否有作品字段 ===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/persons/3936\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nprint('keys:', sorted(d.keys()))\nprint('name:', d.get('name'), '| career:', d.get('career'))\n\" 2>&1 | head -5\necho \"=== persons/3936/subjects 前 5（看有没有收藏数/排序依据）===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/persons/3936/subjects\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nprint('总数:', len(d))\nfor x in d[:5]: print('  -', x.get('id'), (x.get('name_cn') or x.get('name')), '| staff:', x.get('staff'))\n\" 2>&1 | head -8", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 反代 persons/3936/subjects 完整字段（第一个）===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/persons/3936/subjects\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nprint('count:', len(d))\nprint('first item keys:', sorted(d[0].keys()))\n# 看前 10 个的 type 分布（动画=2 应该排前面吗）\nfor x in d[:10]:\n    t = {2:'动画',1:'书籍',3:'音乐',4:'游戏',6:'三次元'}.get(x.get('type'),'?')\n    print(f\\\"  id={x.get('id')} type={t} staff={x.get('staff')} | {(x.get('name_cn') or x.get('name'))[:30]}\\\")\n\" 2>&1 | head -14", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== 钉宫理惠 3936 配音角色（检查重复 id）===\"\ncurl -s -m 20 \"https://bgmapi.anibt.net/v0/persons/3936/characters\" -H \"User-Agent: Mozilla/5.0\" | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nprint('角色总数:', len(d))\nids=[x.get('id') for x in d]\nprint('id 唯一数:', len(set(ids)))\nfrom collections import Counter\ndups=[(k,v) for k,v in Counter(ids).items() if v>1]\nprint('重复 id:', dups[:10] if dups else '无')\nzero=[x for x in d if x.get('id')==0]\nprint('id=0 数量:', len(zero))\n\" 2>&1 | head -8", "Bash=cd \"C:/what i made/niriko\" && for v in 0.9.2 0.9.1 0.9.0; do echo \"=== $v ===\"; timeout 30 curl -s -o /dev/null -w \"%{http_code}\" \"https://repo.maven.apache.org/maven2/top/yukonga/miuix/kmp/miuix-blur-android/$v/miuix-blur-android-$v.pom\"; echo; done", "Bash=cd \"C:/what i made/niriko/.kunsdd/plan\" && python -c \"\nimport os\nfor f in os.listdir('.'):\n    print(repr(f))\n    with open(f, encoding='utf-8') as fh:\n        print(fh.read())\n\"", "Bash=cd \"C:/what i made/niriko/.kunsdd/plan\" && python -c \"\nimport os\nf = [x for x in os.listdir('.') if x.endswith('.md')][0]\nwith open(f, encoding='utf-8') as fh:\n    content = fh.read()\nwith open('_decoded_plan.md', 'w', encoding='utf-8') as fh:\n    fh.write(content)\nprint('written', len(content))\n\""]
