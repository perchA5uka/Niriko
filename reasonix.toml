son.load(open('/tmp/k1.json', encoding='utf-8'))\ndata = d if isinstance(d, list) else d.get('data', [])\nprint('count:', len(data))\nfor x in data[:3]:\n    print('---')\n    print('keys:', sorted(x.keys()))\n    print('id:', x.get('id'))\n    print('name:', x.get('name'))\n    print('name_cn:', x.get('name_cn'))\n    print('type:', x.get('type'))\n    print('total_episodes:', x.get('total_episodes'))\n    print('rating:', x.get('rating'))\n    print('tags:', str(x.get('tags'))[:200])\n\" 2>&1 | head -50", "Bash=cd \"C:/what i made/niriko\" && curl -s -m 20 \"https://api.kazumi.fyi/kazumi/v1/popular/subjects?tag=%E5%BC%82%E4%B8%96%E7%95%8C&limit=3\" -H \"User-Agent: Mozilla/5.0\" -o k1.json && python -c \"\nimport json\nd = json.load(open('k1.json', encoding='utf-8'))\ndata = d if isinstance(d, list) else d.get('data', [])\nprint('count:', len(data))\nfor x in data[:3]:\n    print('---')\n    print('id:', x.get('id'))\n    print('name:', repr(x.get('name'))[:80])\n    print('name_cn:', repr(x.get('name_cn'))[:80])\n    print('type:', x.get('type'))\n    print('rating:', x.get('rating'))\n    print('tags:', str(x.get('tags'))[:300])\n\"", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8 && for tag in \"异世界\" \"京都动画\" \"校园\" \"搞笑\"; do\n  enc=$(python -c \"import urllib.parse,sys; print(urllib.parse.quote('$tag'))\")\n  curl -s -m 20 \"https://api.kazumi.fyi/kazumi/v1/popular/subjects?tag=$enc&limit=5\" -H \"User-Agent: Mozilla/5.0\" -o kx.json\n  echo \"===== tag=$tag =====\"\n  python -c \"\nimport json\nd = json.load(open('kx.json', encoding='utf-8'))\ndata = d if isinstance(d, list) else d.get('data', [])\nprint('count:', len(data))\nfor x in data[:5]:\n    print(' -', x.get('id'), (x.get('name_cn') or x.get('name') or ''))\n\"\ndone", "Bash=cd \"C:/what i made/niriko\" && export PYTHONIOENCODING=utf-8\necho \"=== offset 分页 ===\"; curl -s -m 20 \"https://api.kazumi.fyi/kazumi/v1/popular/subjects?tag=%E5%BC%82%E4%B8%96%E7%95%8C&limit=5&offset=5\