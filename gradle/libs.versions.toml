[versions]
agp = "8.13.2"
kotlin = "2.3.10"
ksp = "2.3.11"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2025.12.01"
navigationCompose = "2.8.5"
room = "2.8.4"
coil = "2.7.0"
materialIconsExtended = "1.7.6"
miuix = "0.9.3"
cloudy = "1.0.0-alpha01"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.6.3"
materialColorUtilities = "2.1.1"
media3 = "1.6.1"
splashscreen = "1.0.1"
work = "2.10.0"
pinyin4j = "2.5.1"

# ── ui-upgrade-plan-2026 批次依赖（B0 探针已通过，见 docs/ui-upgrade-plan-2026.md §十四）──
# B1 图表：Vico 3（v3 API：CartesianChartHost/rememberCartesianChart）
# [B0 探针] 3.3.1 已实测：对 kotlin-stdlib 下 strictly 2.4.10，并把 Compose UI 顶到 1.12.0 → 与本工程
# Kotlin 2.3.10 + BOM 2025.12.01（Compose 1.10.3）不兼容，故先降到 3.2.0 复验（见 §十四）。
vico = "3.2.0"
# B3 日历周月双模（KMP 变体，为 docs/ios-port 铺路）
calendar = "2.10.1"
# B4 加载态骨架屏微光
shimmer = "1.5.0"
# B2 窗口尺寸类别：androidx.compose.material3.adaptive（currentWindowAdaptiveInfo）
# 明令不再引入旧的 androidx.compose.material3:material3-window-size-class，
# 两套尺寸类别判定混用会导致 dock/双栏断点不一致。
adaptive = "1.2.0"
# B6 Robolectric：JVM 上跑真实 Android 运行时（含 SQLite / 资源 / manifest）。
# 其支持的 SDK 上限低于 compileSdk 37，故所有相关测试固定 @Config(sdk = [34])（= targetSdk）。
robolectric = "4.17"

# ── ui-reference-plan-round3 · P2（R5 telephoto，Apache-2.0）──
# zoomable-image-coil 0.19.0 的 POM 依赖 io.coil-kt:coil-compose 2.7.0（与本工程一致）、
# kotlin-stdlib 2.1.21、androidx.compose.runtime 1.8.0 —— 均低于本工程版本，不产生顶版。
telephoto = "0.19.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
# ProcessLifecycleOwner（进前台/退后台刷新触发器）
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose — 版本由 BOM 统一对齐
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }

# Liquid Glass 背景模糊（SukiSU-Ultra 同款）
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuix" }

# Network (Retrofit + OkHttp + Kotlin Serialization)
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# HCT 色彩空间（Google material-color-utilities 的 Kotlin 移植）：任意种子色生成 M3 配色
material-color-utilities = { group = "com.materialkolor", name = "material-color-utilities", version.ref = "materialColorUtilities" }

# 开屏动画（Android 12+ 原生 SplashScreen，26+ 兼容）
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Media3（动态壁纸视频播放）
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# WorkManager（放送提醒周期任务）
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# pinyin4j（阶段 D 拼音搜索；TinyPinyin 仅在 JitPack，镜像不可达，改用 Maven Central 的 pinyin4j）
pinyin4j = { group = "com.belerweb", name = "pinyin4j", version.ref = "pinyin4j" }

# Navigation / Room / Coil
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# ── ui-upgrade-plan-2026 批次依赖 ──
# B1 图表（Apache-2.0）
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
# B3 日历（MIT，KMP 变体）
kizitonwose-calendar = { group = "com.kizitonwose.calendar", name = "compose-multiplatform", version.ref = "calendar" }
# B4 骨架屏微光（Apache-2.0）
compose-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version.ref = "shimmer" }
# B2 窗口尺寸类别（Apache-2.0）
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
# B6 JVM 上的真实 Android 运行时（含 SQLite / 资源 / manifest），只进本地单元测试。
# 其支持的 SDK 上限低于 compileSdk 37，故相关测试固定 @Config(sdk = [34])（= targetSdk）。
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# B6 Room 迁移测试（与 room 同版）。MigrationTestHelper 在 AGP 单元测试下拿不到 assets，
# 实际改用直读 app/schemas 的方式（见 RoomMigrationTest）；本坐标仍保留，用于带入
# androidx.test.ext:junit（@RunWith(AndroidJUnit4)）。
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# ── ui-reference-plan-round3 · P2（R5 图片，Apache-2.0）──
# 子采样缩放（BitmapRegionDecoder），长海报不 OOM
telephoto-zoomable = { group = "me.saket.telephoto", name = "zoomable", version.ref = "telephoto" }
telephoto-zoomable-image-coil = { group = "me.saket.telephoto", name = "zoomable-image-coil", version.ref = "telephoto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
