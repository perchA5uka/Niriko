# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# compileSdk = 37 是 miuix-blur 0.9.0 的硬要求，而 AGP 8.13.2 官方只测到 36.1。
# 不屏蔽这个已知告警会埋掉真正的 AGP 兼容问题；等 AGP 支持 37 后再删掉本行。
android.suppressUnsupportedCompileSdk=37.0

# 不要在这里硬编码 org.gradle.java.home：那会把构建绑死在某台机器的安装路径上，
# 别人 clone 后必然同步失败。需要指定 JDK 17+ 时，用环境变量 JAVA_HOME，
# 或在「本机」的 ~/.gradle/gradle.properties 里自行设置：
#   org.gradle.java.home=/path/to/jdk-17

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 构建缓存与配置缓存（AGP 8.7+ 支持；增量构建提速）
org.gradle.caching=true
org.gradle.configuration-cache=true
