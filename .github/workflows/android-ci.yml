name: Android CI

# 计划 B5 · 6-5：仓库此前没有 CI，单测与构建只能本地跑。
# 本工作流对应 README 的两条命令：testDebugUnitTest（纯 JVM，无需设备）与 assembleDebug。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不要用 android-actions/setup-android@v3：它内部会安装历史遗留的 tools 包，
      # 而该包已从 Google 的 SDK 仓库移除，会让 job 以 Failed to find package 失败。
      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SM_BIN="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SM_BIN" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 2 -type d | head -40
            exit 1
          fi
          echo "sdkmanager: $SM_BIN"
          echo "$(dirname "$SM_BIN")" >> "$GITHUB_PATH"
          "$SM_BIN" --version

      # compileSdk = 37（见 app/build.gradle.kts），runner 预装 SDK 不含它，必须显式安装。
      # 包名与本地 SDK 目录一致：platforms/android-37.0、build-tools/37.0.0。
      - name: Install compileSdk platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (pure JVM, no device)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore
