name: Android CI

# 计划 B5 · 6-5：仓库此前没有 CI，单测与构建只能本地跑。
# 本工作流对应 README 的两条命令：testDebugUnitTest（纯 JVM，无需设备）与 assembleDebug。
#
# 手机端开发（docs/mobile-dev-flow.md）：手机不本地编译，APK 由本工作流产出并以 artifact 上传，
# 手机用 scripts/mobile/ci.sh apk 下载后直接在本机安装验证。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # spotless 的 ratchet 需要 origin/main 作为基线，浅克隆拿不到该引用。
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不要用 android-actions/setup-android@v3：它内部会安装历史遗留的 tools 包，
      # 而该包已从 Google 的 SDK 仓库移除，会让 job 以 Failed to find package 失败。
      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SM_BIN="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SM_BIN" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 2 -type d | head -40
            exit 1
          fi
          echo "sdkmanager: $SM_BIN"
          echo "$(dirname "$SM_BIN")" >> "$GITHUB_PATH"
          "$SM_BIN" --version

      # compileSdk = 37（见 app/build.gradle.kts），runner 预装 SDK 不含它，必须显式安装。
      # 包名与本地 SDK 目录一致：platforms/android-37.0、build-tools/37.0.0。
      - name: Install compileSdk platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 只校验「相对 origin/main 改动过的 Kotlin 文件」的格式，避免存量代码一次性重排。
      # 本地等价：.\gradlew.bat :app:spotlessCheck（默认基线 HEAD = 未提交改动）
      - name: Spotless (changed files only)
        run: ./gradlew :app:spotlessCheck -PspotlessRatchetFrom=origin/main --console=plain

      # ── 可选：发布签名（手机端「同签名覆盖安装」需要）────────────────────────
      # 手机已装的是 release 签名包，debug 包签名不同装不上去（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
      # 仓库 Settings → Secrets 里配了这 4 个 secret，就会多打一个同签名 release 包：
      #   NIRIKO_KEYSTORE_BASE64 / NIRIKO_KEYSTORE_PASSWORD / NIRIKO_KEY_ALIAS / NIRIKO_KEY_PASSWORD
      # 生成方式见 docs/mobile-dev-flow.md §4.3。没配时整段自动跳过，行为与以前一致。
      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.NIRIKO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 NIRIKO_KEYSTORE_BASE64，跳过 release 签名构建（只产 debug 包）"
          fi

      - name: Restore release signing material (optional)
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.NIRIKO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIRIKO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIRIKO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIRIKO_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/niriko-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/niriko-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests (pure JVM, no device)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Assemble release-signed APK (optional)
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew assembleRelease --console=plain

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore

      # 手机端取包入口：scripts/mobile/ci.sh apk [--release]
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niriko-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release-signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: niriko-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android CI"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- ref: \`${{ github.ref_name }}\`"
            for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
              [ -f "$f" ] && echo "- \`$f\` · $(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "手机取包：\`bash scripts/mobile/ci.sh apk\`（同签名包加 \`--release\`）"
          } >> "$GITHUB_STEP_SUMMARY"
