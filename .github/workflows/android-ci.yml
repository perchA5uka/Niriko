name: Android CI

# 计划 B5 · 6-5：仓库此前没有 CI，单测与构建只能本地跑。
# 本工作流对应 README 的两条命令：testDebugUnitTest（纯 JVM，无需设备）与 assembleDebug。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk = 37（见 app/build.gradle.kts），runner 自带 SDK 不含它，必须显式安装。
      # 若该 platform 包在 Google 的 SDK 仓库里还不可用，这一步会失败——
      # 届时把版本号改成仓库里可用的最新 platform。
      - name: Install compileSdk platform + build-tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (pure JVM, no device)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore
